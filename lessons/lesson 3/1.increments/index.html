<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let x = 0;
  x = x + 1;
  console.log(x);
  x++;
  console.log(x);

  x += 1;
  console.log(x);

  x = x - 1;
  console.log(x);
  x *= 1;
  console.log(x);
  x--;
  console.log(x);

  let x = 0;
  ++x;
  console.log(x);

  let a = 0;
  let b = ++a;
  console.log(a, b); 



</script>
</body>
</html>
